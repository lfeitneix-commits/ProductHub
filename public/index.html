<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Hub de Productos Neix</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
/* Layout: app de dos zonas. Sidebar grafito fija (desktop) + contenido crema; en mobile, barra superior y tab bar inferior. Fichas con estética del nuevo one pager. */
:root{
  --bg:#F4F1ED; --surface:#FFFFFF; --surface-2:#EFEBE6; --surface-3:#E7E1D9;
  --ink:#33312E; --ink-2:#6A635A; --ink-3:#958C80; --line:#E3DDD5; --line-2:#D6CEC3;
  --arena:#9A8E7D; --sel:#3D3D3D; --sel-ink:#F7F5F3;
  --side:#2E2D2B; --side-ink:#EDE8E1; --side-2:#A49C90; --side-hi:rgba(255,255,255,.08);
  --ok:#4C7558; --ok-bg:#E3EDE5; --warn:#94661C; --warn-bg:#F5EBD9; --crit:#9C4636; --crit-bg:#F4E2DD;
  --shadow:0 1px 2px rgba(40,35,30,.05),0 6px 20px -12px rgba(40,35,30,.18);
  --shadow-hi:0 2px 4px rgba(40,35,30,.06),0 16px 32px -16px rgba(40,35,30,.28);
  --focus:#7E705E; --logo-a:block; --logo-b:none;
  /* papel del cliente: siempre claro, a propósito */
  --paper:#FFFFFF; --paper-2:#F3EFEA; --paper-ink:#33312E; --paper-ink-2:#6A635A; --paper-line:#E3DDD5; --paper-dark:#33312E; --paper-arena:#9A8E7D;
  --f-display:"Inter", Arial, sans-serif;
  --f-body:"Helvetica Neue", Helvetica, Arial, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1918; --surface:#232220; --surface-2:#2C2A27; --surface-3:#35322E;
  --ink:#ECE7E0; --ink-2:#B6AEA3; --ink-3:#8C8479; --line:#383430; --line-2:#48433E;
  --arena:#B8AB96; --sel:#ECE7E0; --sel-ink:#1A1918;
  --side:#121211; --side-ink:#ECE7E0; --side-2:#8F877C; --side-hi:rgba(255,255,255,.07);
  --ok:#8DBB98; --ok-bg:#22322A; --warn:#DDB167; --warn-bg:#3A2F1C; --crit:#E39483; --crit-bg:#3B2420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px -12px rgba(0,0,0,.6); --shadow-hi:0 2px 4px rgba(0,0,0,.3),0 16px 32px -16px rgba(0,0,0,.7);
  --focus:#CDBFA8; --logo-a:none; --logo-b:block; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1918; --surface:#232220; --surface-2:#2C2A27; --surface-3:#35322E;
  --ink:#ECE7E0; --ink-2:#B6AEA3; --ink-3:#8C8479; --line:#383430; --line-2:#48433E;
  --arena:#B8AB96; --sel:#ECE7E0; --sel-ink:#1A1918;
  --side:#121211; --side-ink:#ECE7E0; --side-2:#8F877C; --side-hi:rgba(255,255,255,.07);
  --ok:#8DBB98; --ok-bg:#22322A; --warn:#DDB167; --warn-bg:#3A2F1C; --crit:#E39483; --crit-bg:#3B2420;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px -12px rgba(0,0,0,.6); --shadow-hi:0 2px 4px rgba(0,0,0,.3),0 16px 32px -16px rgba(0,0,0,.7);
  --focus:#CDBFA8; --logo-a:none; --logo-b:block; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--side)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--arena);font-weight:600}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px} .num{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ── Shell ── */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;padding:22px 14px 18px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.side .brand{display:flex;flex-direction:column;gap:8px;padding:0 10px 22px;text-decoration:none}
.side .brand img{height:16px;width:auto;align-self:flex-start}
.side .brand span{font-family:var(--f-display);font-size:15px;color:var(--side-2)}
.side nav{display:grid;gap:2px}
.nav-a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--side-2);font-size:14px;transition:background .15s,color .15s}
.nav-a:hover{background:var(--side-hi);color:var(--side-ink)}
.nav-a[aria-current="page"]{background:var(--side-hi);color:var(--side-ink);font-weight:600}
.nav-a .count{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--side-ink);color:var(--side);font-size:11px;text-align:center;line-height:20px;font-weight:700}
.side .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--side-hi);font-size:12px;color:var(--side-2);display:grid;gap:4px}
.mtop{display:none}
.tabbar{display:none}
.content{min-width:0}
main{max-width:1160px;margin:0 auto;padding-block:30px 72px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.view{animation:enter .22s ease-out}
@keyframes enter{from{opacity:.4;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ── Encabezados ── */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:clamp(26px,3vw,34px);margin-top:4px}
.page-head p{margin-top:6px;max-width:64ch}

/* ── Controles ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;font-size:13.5px;line-height:1.3;white-space:nowrap;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--arena)} .btn:active{transform:translateY(1px)}
.btn.primary{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)} .btn.primary:hover{opacity:.9}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)} .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.icon{padding:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:13.5px}
textarea.input{min-height:76px;resize:vertical}
label.f{display:grid;gap:5px;font-size:12.5px;color:var(--ink-2);font-weight:500}
label.f .hint{font-size:11.5px;color:var(--ink-3);font-weight:400}
.search{position:relative}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:19px;height:19px}
.search input{padding:13px 14px 13px 44px;font-size:15px;border-radius:12px;box-shadow:var(--shadow);border-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer;line-height:1.2;white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--arena)}
.chip[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none} .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)}
.risk{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-2);white-space:nowrap} .risk i{width:9px;height:9px;border-radius:50%;flex:none} .risk.r-lo i{background:#2E9E5B} .risk.r-mid i{background:#E3B02B} .risk.r-hi i{background:#D2453B}
.uchip::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--u,#999)}
.utag[style]{background:var(--u);color:#fff}.p-hero .units .utag[style]{background:var(--u);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.shm{position:fixed;inset:0;background:rgba(20,19,18,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.shm .box{background:var(--surface);color:var(--ink);border-radius:14px;padding:22px;width:min(480px,100%);display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.shm h3{margin:0;font-size:19px}.shm textarea{min-height:110px}.shm .att{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.utag{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel>h3,.ph{font-size:16px;margin-bottom:10px}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:26px;text-align:center;color:var(--ink-2)}

/* ── Productos ── */
.needs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:18px 0 20px}
.need{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .15s;min-width:0}
.need:hover{border-color:var(--arena);transform:translateY(-1px)}
.need .ic{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.need b{font-size:13px;font-weight:600;line-height:1.3}
.need span.n{font-size:11.5px;color:var(--ink-3)}
.need[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.need[aria-pressed="true"] .ic{background:rgba(255,255,255,.14);color:var(--sel-ink)} .need[aria-pressed="true"] span.n{color:inherit;opacity:.7}
.filters{display:grid;gap:10px;padding:12px 0 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.frow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;min-width:0}
.frow .lbl{font-size:11.5px;color:var(--ink-3);font-weight:600;min-width:52px}
.frow .chips{flex:1;min-width:0}
.rescount{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);padding-top:4px}
.group{margin-top:24px}
.group-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.group-h .ic{width:30px;height:30px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.group-h h2{font-size:20px} .group-h span{font-size:12.5px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-width:0;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi);border-color:var(--line-2)}
.card h3{font-size:17.5px;line-height:1.25}
.card .tit{color:var(--ink-2);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.card .units{display:flex;gap:4px;flex-wrap:wrap}

/* ── Ficha ── */
.crumb{font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;align-items:center;margin-bottom:12px}
.crumb a{text-decoration:none;color:var(--ink-2)} .crumb a:hover{color:var(--ink)}
.p-hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.p-hero .ic{width:46px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center} .p-hero .ic .ico{width:22px;height:22px}
.p-hero h1{font-size:clamp(22px,2.6vw,28px);margin:3px 0 2px}
.p-hero .sub{color:var(--ink-2);font-size:13.5px}
.p-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.p-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.aside{position:sticky;top:20px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px} .kv dt{color:var(--ink-3)} .kv dd{margin:0}

/* One pager en pantalla */
.op{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;box-shadow:var(--shadow)}
.op-hero{padding:24px 26px 20px;background:var(--surface-2);display:grid;gap:8px}
.op-hero img{height:14px;width:auto}
.op-hero h2{font-size:clamp(22px,2.5vw,28px);line-height:1.2;margin-top:8px}
.op-hero p{color:var(--ink-2);font-size:15px;max-width:62ch}
.op-body{padding:4px 26px 22px}
.op-sec{padding:16px 0;border-bottom:1px solid var(--line)}
.op-sec:last-child{border-bottom:0}
.op-sec h3,.op-h{font-size:17px;margin-bottom:8px}
.op-sec p{max-width:70ch}
.op-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{padding:10px 12px;border-right:1px solid var(--line);min-width:0} .facts div:last-child{border-right:0}
.facts dt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--arena);font-weight:600;margin-bottom:3px} .facts dd{margin:0;font-size:12.5px;line-height:1.35}
.blist{display:grid;gap:10px} .blist div{display:grid;gap:2px} .blist b{font-family:var(--f-display);font-weight:500;font-size:15px} .blist span{font-size:13px;color:var(--ink-2)}
ol.steps{list-style:none;padding:0;margin:0;display:grid;gap:7px;counter-reset:s}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:6px;font-size:13.5px}
ol.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--f-display);color:var(--arena);font-size:13px;padding-top:1px}
ul.clean{margin:0;padding-left:17px;display:grid;gap:5px;font-size:13.5px}
.enneix{background:var(--sel);color:var(--sel-ink);padding:16px 18px;border-radius:10px}
.enneix .eyebrow{color:inherit;opacity:.65}
details.fold{border:1px solid var(--line);border-radius:10px}
details.fold>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;font-weight:600;font-size:13.5px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-size:18px;color:var(--ink-3);font-weight:400}
details.fold[open]>summary::after{content:"–"}
details.fold>.in{padding:0 14px 14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
tr:last-child td{border-bottom:0} td.r,th.r{text-align:right}
.tname{font-size:12.5px;font-weight:600;margin:10px 0 6px}

/* Playbook */
.pb{display:grid;gap:12px}
.vent{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.vent div{border-left:2px solid var(--arena);padding:2px 0 2px 12px;display:grid;gap:2px}
.vent b{font-family:var(--f-display);font-weight:500;font-size:15.5px;line-height:1.3}
.vent span{font-size:13px;color:var(--ink-2);line-height:1.45}
.keyfacts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);padding-top:12px;margin-top:14px;border-top:1px solid var(--line)}
.keyfacts b{color:var(--ink);font-weight:600}
.pb3 .panel h3{font-size:14.5px;margin-bottom:8px}
.opstrip{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:36px;font-size:13px}
.opstrip div{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.opstrip b{font-weight:500}.opstrip span{color:var(--ink-2)}
.opimg{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.opimg .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.opimg img{display:block;width:100%;max-width:760px;margin:0 auto;height:auto;background:#fff}
.optag{font-size:11px;font-weight:600;color:var(--ok);background:var(--ok-bg);border-radius:4px;padding:2px 6px}
.upl{display:grid;gap:10px;border:1px dashed var(--line-2);border-radius:10px;padding:12px 14px}
.cobro{background:var(--surface-2);border-radius:var(--r);padding:12px 16px;font-size:13px}
.pb3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pb2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
.warnbox{background:var(--warn-bg);border-radius:var(--r);padding:12px 16px}
.warnbox summary{cursor:pointer;color:var(--warn);font-weight:700;font-size:12.5px;letter-spacing:.04em}
.warnbox ul{margin-top:8px}
.rel{display:flex;flex-wrap:wrap;gap:6px} .rel a{text-decoration:none}

/* Cliente */
.cl-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:12px}
.ia-box{margin-bottom:18px;border-color:var(--line-2)}.ia-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ia-res{font-size:15px;line-height:1.55;margin:12px 0 4px}.ia-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:18px 0 8px}

.xben b{font-weight:500;font-size:14.5px} .xben span{color:var(--ink-2);font-size:14px}
.xsteps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:x}
.xsteps li{counter-increment:x;display:grid;grid-template-columns:30px 1fr;font-size:14.5px;color:var(--ink-2)}
.xsteps li::before{content:counter(x,decimal-leading-zero);font-size:12px;letter-spacing:.08em;color:var(--arena);padding-top:3px}
.xtax{margin-bottom:40px}
.xtax-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:12px 56px;align-items:end;margin-bottom:14px}
.xtax-h h2{font-size:clamp(20px,2vw,24px);font-weight:400}
.xtax .seg{margin-bottom:6px}
.xneix{border-top:1px solid var(--line-2);padding-top:14px;font-size:14.5px}
.tw{border:0;border-radius:0;background:transparent}
table{font-size:13px}
th{background:transparent;font-weight:500;letter-spacing:.1em;color:var(--ink-2);border-bottom:1px solid var(--line-2);padding:10px 12px 10px 0}
td{padding:11px 12px 11px 0;color:var(--ink-2)}
td:first-child{color:var(--ink)}
.gr{display:inline-block;background:var(--dark);color:#fff;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:500}
.tname{font-size:14px;font-weight:500;margin:22px 0 4px;color:var(--ink)}

/* Asesor */
.vent div{border-left:1px solid var(--line-2);padding-left:16px}
.vent b{font-family:var(--f-body);font-weight:500;font-size:15.5px}
.cobro{border-radius:var(--r);padding:18px 22px}

/* Análisis de cartera */
.cart{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:center}
.cart svg{width:150px;height:150px;display:block}
.crow{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;font-size:13.5px;padding:5px 0}
.crow i{width:11px;height:11px;border-radius:2px;display:block}
.crow .pc{color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.crow .us{text-align:right;font-variant-numeric:tabular-nums;min-width:96px}
.alert{background:var(--warn-bg);border-radius:10px;padding:12px 16px;font-size:13.5px;margin-top:16px}
.alert b{display:flex;align-items:center;gap:8px;font-weight:600}.alert b::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.alert.okb{background:var(--ok-bg)}.alert.okb b::before{background:var(--ok)}
.cmp td.r{font-variant-numeric:tabular-nums}
.dif-up{color:var(--ok)} .dif-dn{color:var(--crit)}
/* Presentaciones */
.pz-grid{display:grid;grid-template-columns:370px minmax(0,1fr);gap:22px;align-items:start}
.pz-list{display:grid;gap:4px;max-height:360px;overflow:auto;padding-right:4px}
.pz-list label{display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;cursor:pointer}
.pz-list label:hover{background:var(--surface-2)}
.pz-list .cat{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--arena);font-weight:600;padding:10px 8px 2px}
.slides{display:grid;gap:14px}
.slide-wrap{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:10px;box-shadow:0 8px 24px -14px rgba(0,0,0,.35);background:#fff}
.slide-wrap .sl{position:absolute;top:0;left:0;transform-origin:0 0}
.sl{width:1280px;height:720px;font-family:"Inter","Helvetica Neue",Arial,sans-serif;color:#2A2927;background:#fff;box-sizing:border-box;overflow:hidden;position:relative}
.sl.dk{background:radial-gradient(70% 90% at 50% 125%, rgba(196,178,148,.55), transparent 62%) #262523;color:#F3F0EB}
.sl .lg{position:absolute;top:56px;left:72px;height:22px}
.sl .tg{position:absolute;top:58px;right:72px;font-size:15px;color:#A9A196}
.sl .ey{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#8C7F6B;font-weight:600}
.sl.dk .ey{color:#A9A196}
.sl h1,.sl h2{font-weight:300;letter-spacing:-.025em;margin:0}
.sl .pad{position:absolute;inset:150px 72px 96px 72px;display:flex;flex-direction:column}
.sl .kick{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:999px;padding:8px 18px;font-size:16px;align-self:flex-start}
.sl .kick::before{content:"";width:7px;height:7px;border-radius:50%;background:#D9CDB8}
.sl.lt .kick{background:#F4F2EF;color:#2A2927}
.sl .ft{position:absolute;left:72px;right:72px;bottom:40px;display:flex;justify-content:space-between;font-size:12px;color:#9A9389}
.sl.dk .ft{color:#A9A196}
.sl .ben{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:auto}
.sl .ben div{border-top:1.5px solid #2A2927;padding-top:14px}
.sl .ben b{display:block;font-weight:500;font-size:20px;margin-bottom:6px}
.sl .ben span{font-size:16px;color:#6B655D;line-height:1.45}
.sl .fx{display:grid;grid-template-columns:repeat(4,1fr);margin-top:34px}
.sl .fx div{border-left:1px solid #E7E3DD;padding:0 20px}.sl .fx div:first-child{border-left:0;padding-left:0}
.sl .fx dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8C7F6B;margin-bottom:6px}
.sl .fx dd{margin:0;font-size:18px;line-height:1.3}
.sl .big{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:auto}
.sl .big b{display:block;font-weight:300;font-size:56px;letter-spacing:-.03em;line-height:1}
.sl .big span{display:block;font-size:16px;color:#A9A196;margin-top:10px;line-height:1.35}
.sl .agenda{display:grid;gap:0;margin-top:30px}
.sl .agenda div{display:grid;grid-template-columns:60px 1fr auto;padding:16px 0;border-top:1px solid #E7E3DD;font-size:22px;align-items:baseline}
.sl .agenda span{color:#8C7F6B;font-size:15px}
@media (max-width:900px){.pz-grid,.cart{grid-template-columns:minmax(0,1fr)}.cart svg{margin:0 auto}}
/* Hablemos */
.xfoot{background:radial-gradient(60% 140% at 80% -30%, rgba(196,178,148,.28), transparent 60%) var(--dark);color:var(--dark-ink);margin-top:88px}
.xfoot .in{max-width:1180px;margin:0 auto;padding-block:56px 36px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.xfoot .top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:32px 56px;padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,.12)}
.xfoot h2{font-size:clamp(28px,3vw,36px);margin-bottom:22px}
.xfoot img{height:15px}
.xfoot dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 32px;margin:0}
.xfoot dt{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dark-2);margin-bottom:6px}
.xfoot dd{margin:0;font-weight:500;font-size:14px;overflow-wrap:anywhere}
.xfoot .legal{font-size:11.5px;color:var(--dark-2);padding-top:20px}

@media (max-width:900px){
  .side{display:none}
  .mtop{background:var(--dark)}
  .tabbar{background:var(--dark)}
  main{padding-block:0 40px}
  .page-head,.p-hero{padding-block:40px 48px;margin-bottom:28px}
  .p-hero{grid-template-columns:minmax(0,1fr)}
  .xsplit,.xbox,.xtax-h,.xfoot .top{grid-template-columns:minmax(0,1fr)}
  .xf{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 0}
  .xf div:nth-child(odd){border-left:0;padding-left:0}
  .xfoot{margin-top:56px;padding-bottom:70px}
}
@media (max-width:560px){.xfoot dl{grid-template-columns:minmax(0,1fr)}.xbox{padding:22px}}

const UNI_COLOR = {"Banca Corporativa":"#003F61" /* Azul profundo */, "Banca Privada":"#004836" /* Verde inglés */, "Financial Advisors":"#9A8E7D" /* Arena */, "Mercado de Capitales":"#476785" /* Azul acero */};

const blobUrl = id => /^(https?:|blob:|\/|onepagers\/)/.test(String(id)) ? id : "/_blob/" + id;
async function dlPdf(id){
  const p = S.byId[id]; if (!p || !p.onePager) return;
  if (!S.dl) { toast("La descarga no está disponible en esta vista"); return; }
  let buf = null;
  try { const r = await fetch(blobUrl(p.onePager.pdf), {credentials:"same-origin", cache:"no-store"}); if (r.ok) buf = await r.arrayBuffer(); } catch(_) {}
  const ok = buf && buf.byteLength > 1000 && new TextDecoder().decode(new Uint8Array(buf, 0, 5)) === "%PDF-";
  if (!ok) { toast("Abrimos el PDF original en otra pestaña"); const l = document.createElement("a"); l.href = blobUrl(p.onePager.pdf); l.target = "_blank"; l.rel = "noopener"; document.body.appendChild(l); l.click(); l.remove(); return; }
  try { await S.dl.save({filename: p.onePager.archivo || (p.nombre+" - Neix.pdf"), data: new Blob([buf], {type:"application/pdf"})}); toast("PDF listo"); }
  catch(e) { if (e && e.code === "declined") return; toast(e && e.code === "rate_limited" ? "Ya hay una descarga pendiente" : "No pudimos descargar el PDF. Usá Abrir PDF."); }
}
function estadoDe(p){
  const v = S.vals[p.id] || (p.estado === "validado" ? {estado:"validado", fecha:p.ultimaRevision, vence:p.vence, por:p.validador} : null); // validación cargada en la ficha
  const vence = v && v.vence ? v.vence : p.vence;
  const d = daysTo(vence);
  if (d !== null && d < 0) return {k:"vencida", txt:"Vencida", cls:"crit", vence, d, v};
  if (v && v.estado === "validado") return {k:"validado", txt: d !== null && d <= 30 ? "Vence pronto" : "Validada", cls: d !== null && d <= 30 ? "warn" : "ok", vence, d, v};
  return {k:"a_validar", txt:"A validar", cls:"warn", vence, d, v};
}

/* ── Matcher ── */
function evaluar(p, c){
  const m = p.match, r = {p, score:0, why:[], cond:[], no:[], tiene:false};
  const held = (c.tenencia||[]).map(h=>h.tag);
  if (m.tenencia.some(t=>held.includes(t))) r.tiene = true;
  if (c.tipo && !m.tipos.includes(c.tipo)) r.no.push("Pensado para " + m.tipos.map(t=>TIPO[t]).join(", ").toLowerCase());
  if (c.perfil) { const gap = p.riesgoNivel - PERFIL_MAX[c.perfil]; if (gap >= 2) r.no.push("Riesgo alto para un perfil " + PERFIL[c.perfil].toLowerCase()); else if (gap === 1) r.cond.push("Riesgo por encima del perfil: usar como parte menor"); }
  if (m.minimoUSD && c.patrimonio && Number(c.patrimonio) < m.minimoUSD) r.cond.push("Requiere desde " + usd(m.minimoUSD));
  c.objetivos.forEach(o => { if (m.objetivos.includes(o)) { r.score += 2; r.why.push(OBJ[o]); } });
  c.eventos.forEach(e => { if (m.eventos.includes(e)) { r.score += 3; r.why.push(EVT[e]); } });
  if (c.horizonte && m.horizonte.includes(c.horizonte)) r.score += 1;
  return r;
}
function resultados(){
  const c = S.cliente, out = {rec:[], pos:[], tiene:[], no:[], cross:[]};
  S.productos.map(p => evaluar(p, c)).forEach(r => {
    if (r.tiene) out.tiene.push(r);
    else if (r.no.length) out.no.push(r);
    else if (r.score >= 4 && !r.cond.length) out.rec.push(r);
    else if (r.score >= 2) out.pos.push(r);
  });
  out.rec.sort((a,b)=>b.score-a.score); out.pos.sort((a,b)=>b.score-a.score);
  const shown = new Set([...out.rec, ...out.pos, ...out.tiene].map(r=>r.p.id)), cross = {};
  out.tiene.forEach(r => r.p.interno.relacionados.forEach(id => { const q = S.byId[id]; if (!q || shown.has(id)) return; const e = evaluar(q, c); if (e.no.length || e.tiene) return; (cross[id] = cross[id] || {r:e, from:[]}).from.push(r.p.nombre); }));
  out.cross = Object.values(cross);
  return out;
}

/* ── Router ── */
/* Volver: página anterior del Hub, o Productos si se entró directo a la ficha. La lista recuerda dónde estabas. */
const scrollPos = {}; let prevRoute = null, volviendo = false;
function volver(){ if (prevRoute !== null) { volviendo = true; history.back(); } else go("soluciones"); }
function route(){ const h = (location.hash || "").slice(1); return (!h || h === "catalogo") ? "soluciones" : h; }
function go(h){ if (location.hash.slice(1) === h) render(); else location.hash = h; }
let rutaActual = null;
window.addEventListener("hashchange", () => {
  if (S.envio || $("#shm")) cerrarEnvio();
  if (rutaActual !== null) scrollPos[rutaActual] = window.scrollY;
  const r = route(), y = volviendo ? (scrollPos[r] || 0) : 0;
  prevRoute = volviendo ? null : rutaActual; volviendo = false; rutaActual = r;
  render(true); window.scrollTo(0, y);
});

/* ── Render ── */
function render(anim){
  const r = route(), app = $("#app");
  const sec = r.startsWith("p-") ? "soluciones" : r.startsWith("editar-") ? "gestion" : r;
  document.querySelectorAll("[data-sec]").forEach(a => a.setAttribute("aria-current", a.dataset.sec === sec ? "page" : "false"));
  document.querySelectorAll("[data-admin]").forEach(a => a.hidden = !puedeGestionar());
  document.querySelectorAll(".pcount").forEach(c => { c.textContent = S.prop.items.length; c.hidden = !S.prop.items.length; });
  let html;
  if (r === "ingresar") html = vIngresar();
  else if (S.dbMissing) html = stateMsg("No pudimos abrir la base de fichas", "Revisá tu conexión y recargá la página. Si sigue igual, avisale a Marketing.");
  else if (S.loading && !S.productos.length) html = stateMsg(S.slow ? "No pudimos conectar con la base de fichas" : "Cargando productos", S.slow ? "Revisá tu conexión. El Hub se actualiza solo cuando la base responda." : "Un momento.");
  else if (!S.productos.length) html = stateMsg("Todavía no hay fichas cargadas", "Marketing las carga desde Gestión.");
  else if (r === "soluciones") html = vSoluciones();
  else if (r.startsWith("p-")) html = vProducto(r.slice(2));
  else if (r.startsWith("editar-")) html = vEditar(r.slice(7));
  else if (r === "cliente") html = vCliente();
  else if (r === "simuladores") html = vSimuladores();
  else if (r === "propuesta") html = vPropuesta();
  else if (r === "presentaciones") html = vPresentaciones();
  else if (r === "gestion") html = puedeGestionar() ? vGestion() : stateMsg("Gestión es para el equipo de Marketing", "Si necesitás cambiar una ficha, dejá una nota al validarla.");
  else html = vSoluciones();
  app.innerHTML = `<div class="${anim?"view":""}">${html}</div>`;
  footer(r);
  if (r === "simuladores") calcSim();
  if (r === "propuesta") refreshPreview();
  if (r === "presentaciones") refreshDeck();
}

const sinAcento = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const needsDe = p => NEEDS.filter(n=>p.match.objetivos.some(o=>n.objs.includes(o)));
function filtrar(){
  const q = sinAcento(S.q.trim()), needs = NEEDS.filter(n=>S.fNeeds.includes(n.k));
  return S.productos.filter(p => {
    if (S.fUnidad && !p.unidades.includes(S.fUnidad)) return false;
    if (S.fCat && p.categoria !== S.fCat) return false;
    if (S.fEstado && estadoDe(p).k !== S.fEstado) return false;
    if (needs.length && !needs.some(n=>p.match.objetivos.some(o=>n.objs.includes(o)))) return false;
    if (q) { const hay = sinAcento(p.nombre+" "+p.cliente.titular+" "+p.categoria+" "+p.interno.perfiles.join(" ")+" "+p.unidades.join(" ")+" "+ventajas(p).map(v=>v.join(" ")).join(" ")+" "+needsDe(p).map(n=>n.label).join(" ")+" "+p.match.objetivos.map(o=>OBJ[o]||"").join(" ")); if (!q.split(/\s+/).every(w=>hay.includes(w))) return false; }
    return true;
  });
}

/* ── Análisis con IA ──

const iaModo = () => (window.NEIX_IA && window.NEIX_IA.modo) || "simulacion";
/* Características de cada tipo de activo de la tenencia (para métricas y rotaciones). */

};

const DEST_TAG = {"obligaciones-negociables":"on", "bonos-iliquidos":"on", "fondos-offshore":"internacional", "t-bills":"tbills", "cedears":"cedears", "bonos-cer-dl":"dl", "fci":"fci", "cauciones":"caucion"};
const r5 = n => Math.max(5000, Math.round(n / 5000) * 5000);
const pctf = n => Math.round(n);
function metricasCartera(c){
  const h = c.tenencia || [], tot = h.reduce((a,x)=>a+x.usd,0);
  if (!tot) return null;
  const w = x => x.usd / tot, sum = f => h.reduce((a,x)=>a + (f(ACT[x.tag]||{}) ? w(x) : 0), 0);
  const riesgo = h.reduce((a,x)=>a + w(x) * ((ACT[x.tag]||{}).riesgo || 3), 0);
  const hhi = h.reduce((a,x)=>a + w(x) ** 2, 0);
  return {tot, riesgo_ponderado: Math.round(riesgo*10)/10, riesgo_objetivo: RIESGO_OBJ[c.perfil] || null,
    dolarizacion_pct: pctf(sum(a=>a.usd)*100), riesgo_argentino_pct: pctf(sum(a=>a.arg)*100),
    liquidez_inmediata_pct: pctf(sum(a=>a.liq)*100), posiciones_efectivas: Math.round(1/hhi*10)/10};
}

    },

    catalogo: S.productos.map(p=>({id:p.id, nombre:p.nombre, categoria:p.categoria, riesgo:RISK_TXT[p.riesgoNivel]||"", para_que:p.cliente.titular,
      pitch:p.interno.pitch||"", senales:p.interno.senales||[], perfiles:p.match.perfiles||[], unidades:p.unidades}))

  const diag = [], rot = [];
  /* 1. Asignación actual vs modelo */
  const act = {}; ten.forEach(x => { const k = CLASE[x.tag] || "Otros"; act[k] = (act[k]||0) + x.usd; });
  const clases = [...new Set(Object.keys(mod).concat(Object.keys(act)))];
  const gap = {}; clases.forEach(k => gap[k] = (act[k]||0) - (mod[k]||0) / 100 * tot);   // USD de más (+) o de menos (-)
  /* 2. Concentración en una posición: rotar el exceso sobre 25% */
  const orden = ten.slice().sort((a,b)=>b.usd-a.usd), top = orden[0];
  const usados = {};
  const mover = (de, a, monto) => { if (de) gap[de] = (gap[de]||0) - monto; if (a) gap[a] = (gap[a]||0) + monto; };
  if (top && top.usd / tot > .30 && !(ACT[top.tag]||{}).liq) {
    const exceso = top.usd - .25 * tot, hacia = top.tag === "soberanos" ? "obligaciones-negociables" : top.tag === "on" ? "bonos-iliquidos" : top.tag === "cedears" || top.tag === "acciones" ? "fondos-offshore" : "t-bills";
    const kd = CLASE[DEST_TAG[hacia]], cabe = kd && kd !== CLASE[top.tag] ? Math.max(0, -gap[kd] + .05 * tot) : exceso;
    if (S.byId[hacia] && Math.min(exceso, cabe) >= .03 * tot) {
      const montoC = r5(Math.min(exceso, cabe));
      rot.push({desde: top.activo, hacia_producto_id: hacia, monto_usd: montoC,
        motivo: `${top.activo} pesa ${pctf(top.usd/tot*100)}% de la cartera: un solo emisor define el resultado.`,
        impacto: top.tag === "soberanos" ? "Mismo dólar y perfil de renta, pero con riesgo corporativo en lugar de soberano. Se ejecuta como swap, sin salir del mercado." : "Baja la dependencia de una sola posición sin cambiar la moneda."});
      usados[top.activo] = montoC;
      mover(CLASE[top.tag], CLASE[DEST_TAG[hacia]], montoC);
    }
  }
  /* 3. Rotaciones entre clases: de la más sobreponderada a la más subponderada */
  const sobran = clases.filter(k => gap[k] > .05 * tot).sort((a,b)=>gap[b]-gap[a]);
  const enPesos = k => k === "Liquidez en pesos" || k === "Cobertura (CER / DL)";
  const faltan = clases.filter(k => gap[k] < -.05 * tot && DESTINO[k]).sort((a,b)=>gap[a]-gap[b]);
  sobran.forEach(k => {
    faltan.forEach(f => {
      if (rot.length >= 3) return;
      if (enUSD && !enPesos(k) && enPesos(f)) return; // busca preservar dólares: no se rotan dólares a pesos
      const monto = Math.min(gap[k], -gap[f]); if (monto < .03 * tot) return;
      const fuente = orden.filter(x => (CLASE[x.tag]||"Otros") === k).map(x => ({x, libre: x.usd - (usados[x.activo]||0)})).sort((a,b)=>b.libre-a.libre)[0];
      const hacia = DESTINO[f](c); if (!fuente || fuente.libre < 2000 || !S.byId[hacia] || rot.some(r=>r.hacia_producto_id===hacia)) return;
      const usdRot = r5(Math.min(monto, fuente.libre));
      rot.push({desde: fuente.x.activo, hacia_producto_id: hacia, monto_usd: usdRot,
        motivo: `${k} está ${pctf(gap[k]/tot*100)} pp por encima del modelo ${nombreModelo} y ${f.toLowerCase()} ${pctf(-gap[f]/tot*100)} pp por debajo.`,
        impacto: f === "Internacional" ? "Suma dólares con riesgo Estados Unidos y baja la exposición a Argentina." : f === "Renta variable" ? "Agrega potencial de crecimiento en dólares (vía CCL) con empresas globales." : f === "Cobertura (CER / DL)" ? "Protege los pesos contra inflación o devaluación oficial." : f === "Liquidez en pesos" ? "Deja disponible lo que puede necesitar en el corto plazo." : "Renta en dólares con flujo conocido."});
      mover(k, f, usdRot); usados[fuente.x.activo] = (usados[fuente.x.activo]||0) + usdRot;
    });
  });
  /* 4. Liquidez en pesos ociosa con objetivo en dólares */
  const liqARS = ten.filter(x => (ACT[x.tag]||{}).liq).reduce((a,x)=>a+x.usd,0);
  if (rot.length < 3 && liqARS > .15 * tot && (c.objetivos.includes("preservar_usd") || c.objetivos.includes("cobertura_devaluacion")) && !rot.some(r=>r.hacia_producto_id==="bonos-cer-dl") && S.byId["bonos-cer-dl"]) {
    const src = orden.find(x => (ACT[x.tag]||{}).liq);
    mover(CLASE[src.tag], CLASE.dl, r5(liqARS * .5));
    rot.push({desde: src.activo, hacia_producto_id: "bonos-cer-dl", monto_usd: r5(liqARS * .5),
      motivo: `Tiene ${pctf(liqARS/tot*100)}% en pesos de corto plazo y busca proteger el valor en dólares.`,
      impacto: "Mantiene la mitad líquida y cubre el resto contra devaluación sin necesidad de dolarizar."});
  }
  /* Diagnóstico */
  if (m) {
    const ro = m.riesgo_objetivo;
    if (ro && m.riesgo_ponderado > ro + .5) diag.push({titulo:"Más riesgo que el que admite su perfil", detalle:`Riesgo ponderado ${fmt(m.riesgo_ponderado,1)} sobre 5, contra ${fmt(ro,1)} esperado para un perfil ${PERFIL[perfil].toLowerCase()}. Conviene bajar exposición antes de sumar productos nuevos.`, nivel:"alerta"});
    else if (ro && m.riesgo_ponderado < ro - .6) diag.push({titulo:"Cartera más conservadora que su perfil", detalle:`Riesgo ponderado ${fmt(m.riesgo_ponderado,1)} sobre 5, contra ${fmt(ro,1)} esperado. Hay margen para buscar más rendimiento sin salirse del perfil.`, nivel:"oportunidad"});
    else if (ro) diag.push({titulo:"Riesgo alineado con el perfil", detalle:`Riesgo ponderado ${fmt(m.riesgo_ponderado,1)} sobre 5, en línea con el ${fmt(ro,1)} esperado para su perfil.`, nivel:"ok"});
    if (m.riesgo_argentino_pct >= 70) diag.push({titulo:"Exposición alta a Argentina", detalle:`El ${m.riesgo_argentino_pct}% depende de emisores o pesos argentinos. Aunque esté en dólares, un evento local le pega a casi toda la cartera.`, nivel:"alerta"});
    if (m.posiciones_efectivas < 3.5) diag.push({titulo:"Diversificación baja", detalle:`Equivale a ${fmt(m.posiciones_efectivas,1)} posiciones del mismo peso${top ? `; ${top.activo} explica el ${pctf(top.usd/tot*100)}%` : ""}.`, nivel:"alerta"});
    if (m.liquidez_inmediata_pct >= 25) diag.push({titulo:"Liquidez ociosa", detalle:`${m.liquidez_inmediata_pct}% en caución o money market: rinde poco en términos reales si no la necesita en las próximas semanas.`, nivel:"oportunidad"});
  }
  if (c.eventos.includes("excedente_liquidez")) diag.push({titulo:"Tiene liquidez sin invertir", detalle:"Es el disparador de la conversación: proponé la rotación con el destino de esos fondos ya resuelto.", nivel:"oportunidad"});
  if (!m) diag.push({titulo:"Sin tenencia cargada", detalle:"El análisis se basa en lo que busca y su situación. Leé la cuenta comitente para sumar métricas y rotaciones.", nivel:"ok"});
  /* Asignación propuesta (después de las rotaciones) */
  const asignacion = m ? clases.map(k => ({clase:k, actual_pct: pctf((act[k]||0)/tot*100), modelo_pct: mod[k]||0, propuesto_pct: pctf(((mod[k]||0)/100*tot + gap[k])/tot*100)})) : [];
  /* Estrategia: primero los destinos de las rotaciones, después lo que pide su objetivo */
  const ids = []; rot.forEach(r => { if (!ids.includes(r.hacia_producto_id)) ids.push(r.hacia_producto_id); });
  R.rec.concat(R.pos).forEach(r => { if (ids.length < 4 && !ids.includes(r.p.id)) ids.push(r.p.id); });
  const estrategia = ids.slice(0, 4).map((id, i) => {
    const p = S.byId[id], ev = evaluar(p, c), ro = rot.find(r => r.hacia_producto_id === id);
    return {producto_id:id, prioridad:i+1,
      por_que: ro ? `Destino de la rotación desde ${ro.desde} (${usd(ro.monto_usd)}). ${ro.impacto}` : `${p.cliente.titular}.${ev.why.length ? " Responde a " + ev.why.slice(0,2).join(" y ").toLowerCase() + "." : ""}`,
      argumento: p.interno.pitch || p.cliente.bajada || p.cliente.titular};
  });
  /* Resumen y próximo paso */
  const totRot = rot.reduce((a,r)=>a+r.monto_usd,0);
  const resumen = m
    ? `${c.nombre || "El cliente"} tiene ${usd(tot)} con riesgo ponderado ${fmt(m.riesgo_ponderado,1)}/5 (perfil ${PERFIL[perfil].toLowerCase()}), ${m.dolarizacion_pct}% dolarizado y ${m.riesgo_argentino_pct}% expuesto a Argentina. `
      + (rot.length ? `Proponemos ${rot.length} ${rot.length===1?"rotación":"rotaciones"} por ${usd(totRot)} (${pctf(totRot/tot*100)}% de la cartera) para acercarla al modelo ${nombreModelo}, sin cambiar su perfil.` : "La cartera está cerca del modelo: el foco es sumar lo que busca con fondos nuevos.")
    : `${c.nombre || "El cliente"}: sin tenencia cargada. La estrategia sale de lo que busca y su situación.`;
  const proximo_paso = rot.length
    ? `Llamalo esta semana con la rotación 1 (${usd(rot[0].monto_usd)} de ${rot[0].desde} a ${S.byId[rot[0].hacia_producto_id].nombre}) como titular, y mandale la propuesta con ${estrategia.slice(0,2).map(e=>S.byId[e.producto_id].nombre).join(" y ")}.`
    : estrategia.length ? `Mandale la propuesta con ${estrategia.slice(0,2).map(e=>S.byId[e.producto_id].nombre).join(" y ")} y coordiná una llamada para definir montos.` : "Completá qué busca y su situación para armar la estrategia.";
  return {resumen, metricas: m ? (({tot, ...x}) => x)(m) : null, asignacion, diagnostico: diag, rotaciones: rot, estrategia, proximo_paso};
}
async function analizarIA(){

/* ── Cheques: Neix vs. banco ──
   Copia literal de "CPD con fórmulas.xlsx" (Hoja1). Cada línea indica la celda del Excel.
   Entradas: C3 monto del cheque, C7/D7 tasa de descuento, C9/D9 plazo (sale de las fechas), G17 comisión de negociación (TNA), G19 comisión de mercado (% cheque).
   Agregado al Excel: la comisión de negociación puede ser TNA (fórmula original de C17) o directa (% del monto). */
const isoHoy = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
const isoMas = (iso, dias) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + dias); return d.toISOString().slice(0,10); };
/* Fecha de cobro: T0 = el día de la negociación; T1 = el día hábil siguiente (salta sábados y domingos; no contempla feriados). */
function fechaCobro(v){
  if (!v.fNeg) return "";
  if (v.cobro !== "T1") return v.fNeg;
  let f = isoMas(v.fNeg, 1); while ([0,6].includes(new Date(f + "T12:00:00").getDay())) f = isoMas(f, 1);
  return f;
}
const diasEntre = (a, b) => a && b ? Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5) : 0;
const fLarga = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("es-AR", {day:"numeric", month:"long", year:"numeric"}) : "";
function cpdCalc(v){
  const C3 = +v.precio, C7 = +v.tasaNeix/100, D7 = +v.tasaBanco/100, G17 = +v.comNeg/100, G19 = +v.comMer/100;
  const cobro = fechaCobro(v), dias = Math.max(0, diasEntre(cobro, v.fVto));
  const C9 = dias, D9 = dias;                                // VALUE(SUBSTITUTE(C9," días","")): días entre la fecha de cobro y el vencimiento
  const C8 = -C3*C7*C9/365;                                  // =-$C$3*C7*VALUE(SUBSTITUTE(C9," días",""))/365
  const D8 = -C3*D7*D9/365;                                  // =-$C$3*D7*VALUE(SUBSTITUTE(D9," días",""))/365
  const C11 = 0, C12 = 0, C13 = 0, C14 = 0, C15 = 0, C16 = 0; // Neix: sin IVA, IVA RIN, IIBB, imp. crédito, sellos ni comisión bancaria
  const D11 = D8*0.21;                                       // =D8*21%      IVA sobre intereses
  const D12 = D8*0.015;                                      // =D8*1.5%     IVA RIN
  const D13 = D8*0.0175;                                     // =D8*1.75%    I.I.B.B.
  const D14 = -(C3+D8+D11)*0.006;                            // =-($C$3+D8+D11)*0.6%   Imp. crédito
  const D15 = 0, D16 = 0;                                    // Imp. de sellos, comisión bancaria
  const comDirecta = v.comTipo === "directa", GD = +v.comDir/100;
  const C17 = comDirecta ? -C3*GD : -C3*G17*C9/365, D17 = 0; // TNA: =-$C$3*$G$17*VALUE(SUBSTITUTE(C9," días",""))/365 · Directa: -monto × %
  const C18 = C17*0.21, D18 = 0;                             // =C17*21%     IVA (comisión)
  const C19 = -C3*G19, D19 = 0;                              // =-$C$3*$G$19  Comisión de mercado
  const C20 = C19*0.21, D20 = 0;                             // =C19*21%     IVA (derecho de mercado)
  const C21 = C17+C18+C19+C20+C8;                            // =SUM(C17:C20,C8)
  const D21 = D8+D11+D12+D13+D14;                            // =SUM(D8,D11:D14)
  const C6 = C3+C21, D6 = C3+D21;                            // =C3+C21 / =C3+D21  Neto acreditado
  const D23 = D21-C21;                                       // =SUM(D21-C21)  Diferencia $
  const D24 = (C6-D6)/C3;                                    // =(C6-D6)/$C$3  Diferencia directa
  const D25 = C9 ? D24*365/C9 : 0;                           // =D24*365/VALUE(SUBSTITUTE(C9," días",""))  Diferencia en TNA
  return {C3, C6, D6, C7, D7, C8, D8, C9, D9, C11, C12, C13, C14, C15, C16, D11, D12, D13, D14, D15, D16,
          C17, D17, C18, D18, C19, D19, C20, D20, C21, D21, D23, D24, D25, G17, G19, GD, comDirecta, cobro};
}

/* Halo arena de la banda: se dibuja como imagen (elipse ancha pegada al borde inferior, como en las fichas oficiales),
   porque el conversor a PDF no respeta los degradados ovalados. */
function aplicarHalo(root){
  /* Medido sobre la ficha oficial: fondo gris (35,35,35) y luz arena con caída gaussiana,
     centro a lo ancho en el medio y 4,2% del ancho por debajo del borde; radios 50% y 12,8% del ancho. */
  root.querySelectorAll(".opx-hero").forEach(h => {
    const w = h.offsetWidth, ht = h.offsetHeight, c = document.createElement("canvas"); c.width = w; c.height = ht;
    const g = c.getContext("2d"), img = g.createImageData(w, ht), d = img.data;
    const cx = 0.5 * w, cy = ht + 0.042 * w, rx = 0.5 * w, ry = 0.128 * w, A = [143.6, 129.0, 108.1];
    for (let y = 0; y < ht; y++) for (let x = 0; x < w; x++) {
      const k = Math.exp(-(((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2)), o = (y * w + x) * 4;
      d[o] = 35 + A[0] * k; d[o+1] = 35 + A[1] * k; d[o+2] = 35 + A[2] * k; d[o+3] = 255;
    }
    g.putImageData(img, 0, 0);
    h.style.backgroundImage = `url(${c.toDataURL("image/png")})`;
  });
}

function falCalc(v){
  const tasa = v.tipo==="pyme" ? .025 : .01, tna = v.fondo==="I" ? .23 : .28, gm = Math.pow(1+(+v.aj)/100, 1/12);
  let saldo = 0, sal = +v.sal, be = null; const pts = [];
  const aporte0 = +v.emp*sal*tasa;
  for (let m=1; m<=Math.max(1,+v.meses); m++){
    saldo = saldo*(1+tna/12) + (+v.emp)*sal*tasa;
    const ind = (+v.emp)*(+v.rot/100)*sal*(+v.ant);
    if (be===null && saldo >= ind) be = m;
    pts.push({m, saldo, ind}); sal *= gm;
  }
  return {pts, be, saldoFin: pts[pts.length-1].saldo, indFin: pts[pts.length-1].ind, aporte0};
}

  const path = k => r.pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p[k]).toFixed(1)).join(" ");

   <path d="${path("saldo")}" fill="none" stroke="var(--ink)" stroke-width="2.2"/>

   ${r.be?`<circle cx="${x(r.be-1)}" cy="${y(r.pts[r.be-1].saldo)}" r="5" fill="var(--ink)"/><text x="${x(r.be-1)+8}" y="${y(r.pts[r.be-1].saldo)-8}" font-size="12" fill="var(--ink)">Breakeven · mes ${r.be}</text>`:""}

const CLASE = {caucion:"Liquidez en pesos", fci:"Liquidez en pesos", soberanos:"Renta fija en dólares", on:"Renta fija en dólares", dl:"Cobertura (CER / DL)", cer:"Cobertura (CER / DL)", acciones:"Renta variable", cedears:"Renta variable", internacional:"Internacional", tbills:"Internacional"};
const MODELO = {
  conservador:{"Liquidez en pesos":20,"Renta fija en dólares":55,"Cobertura (CER / DL)":15,"Renta variable":5,"Internacional":5},
  moderado:{"Liquidez en pesos":10,"Renta fija en dólares":45,"Cobertura (CER / DL)":10,"Renta variable":20,"Internacional":15},
  agresivo:{"Liquidez en pesos":5,"Renta fija en dólares":30,"Cobertura (CER / DL)":5,"Renta variable":40,"Internacional":20}};
/* Empresas (pyme y grande): cartera de tesorería, con más liquidez y cobertura. */
const MODELO_EMPRESA = {"Liquidez en pesos":45,"Renta fija en dólares":20,"Cobertura (CER / DL)":25,"Renta variable":0,"Internacional":10};
const modeloDe = c => (c.tipo === "pyme" || c.tipo === "grande") ? MODELO_EMPRESA : (MODELO[c.perfil] || MODELO.moderado);
const PIE = ["#2F2E2B","#A59A86","#A8243A","#6E675E","#CFC6B8","#4C7558","#8C7F6B","#D9B98C"];
function donut(parts){
  const tot = parts.reduce((a,p)=>a+p.v,0)||1, R = 60, C = 2*Math.PI*R; let off = 0;
  return `<svg viewBox="0 0 150 150" role="img" aria-label="Composición de la cartera"><g transform="rotate(-90 75 75)">${parts.map((p,i)=>{ const L = p.v/tot*C, el = `<circle cx="75" cy="75" r="${R}" fill="none" stroke="${PIE[i%PIE.length]}" stroke-width="22" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-off}"/>`; off += L; return el; }).join("")}</g></svg>`;
}
function carteraHTML(c){
  const h = c.tenencia.slice().sort((a,b)=>b.usd-a.usd), tot = h.reduce((a,x)=>a+x.usd,0)||1, top = h[0];
  const conc = top && top.usd/tot >= .35;
  const perfil = c.perfil || "moderado", mod = modeloDe(c), emp = mod === MODELO_EMPRESA;
  const act = {}; h.forEach(x=>{ const k = CLASE[x.tag]||"Otros"; act[k] = (act[k]||0) + x.usd/tot*100; });
  const clases = [...new Set(Object.keys(mod).concat(Object.keys(act)))];
  return `<div class="res-sec"><h3>Análisis de la cartera <span class="muted small">${esc(c.nombre)}</span></h3>
  <div class="panel"><div class="cart">${donut(h.map(x=>({v:x.usd})))}<div>${h.map((x,i)=>`<div class="crow"><i style="background:${PIE[i%PIE.length]}"></i><span>${esc(x.activo)}</span><span class="pc">${fmt(x.usd/tot*100,1)}%</span><span class="us">${usd(x.usd)}</span></div>`).join("")}</div></div>
  ${conc?`<div class="alert"><b>Concentración</b>${esc(top.activo)} es el ${fmt(top.usd/tot*100,0)}% de la cartera.</div>`:`<div class="alert okb"><b>Cartera diversificada</b>Ninguna posición supera el 35% del total.</div>`}
  <details class="fold" style="margin-top:12px"><summary>Comparar con la cartera modelo ${emp ? "de tesorería para empresas" : "para perfil " + esc(PERFIL[perfil].toLowerCase())}</summary><div class="in"><div class="tw"><table class="cmp"><thead><tr><th>Clase de activo</th><th class="r">Actual</th><th class="r">Modelo</th><th class="r">Diferencia</th></tr></thead><tbody>
   ${clases.map(k=>{ const a = act[k]||0, m = mod[k]||0, d = a-m; return `<tr><td>${esc(k)}</td><td class="r">${fmt(a,0)}%</td><td class="r">${fmt(m,0)}%</td><td class="r ${Math.abs(d)<5?"":d>0?"dif-up":"dif-dn"}">${d>0?"+":""}${fmt(d,0)} pp</td></tr>`; }).join("")}</tbody></table></div>

}

  else if (a==="cpdPDF") cpdPDF(b);
  else if (a==="cpdVer") cpdVer();
  else if (a==="iaCliente") analizarIA();
  else if (a==="iaProp") { analisisAPropuesta(); }
  else if (a==="iaPropQuitar") { delete S.prop.analisis; persist(); render(); toast("Análisis quitado de la propuesta"); }
  else if (a==="iaTodo" && S.ia && S.ia.data) { S.ia.data.estrategia.forEach(e=>{ if (!S.prop.items.some(i=>i.id===e.producto_id)) S.prop.items.push({id:e.producto_id, nota:e.por_que}); }); persist(); render(); toast("Sumados a la propuesta"); }
  else if (a==="validar") validar(id);
  else if (a==="notaMkt") notaMkt(id);
  else if (a==="save") save(id);
  else if (a==="enviarLink") enviarLink(b);
  else if (a==="ingOtra") { S.ing = {}; render(); }
  else if (a==="completarLink") completarLink(b);
  else if (a==="logout") { e.preventDefault(); window.neixRuntime.logout(); }
  else if (a==="cset") { S.cliente[b.dataset.k] = S.cliente[b.dataset.k]===v ? "" : v; persist(); render(); }
  else if (a==="cmulti") { const arr = S.cliente[b.dataset.k], i = arr.indexOf(v); i>=0 ? arr.splice(i,1) : arr.push(v); persist(); render(); }
  else if (a==="resetC") { S.cliente = blankCliente(); S.ia = null; persist(); render(); }
  else if (a==="consultar") consultar();
  else if (a==="sim") { S.sim = v; render(); }
  else if (a==="pzSug") { PZ_SUG[+v][1].forEach(id=>{ if (S.byId[id] && !S.pz.items.includes(id)) S.pz.items.push(id); }); pzSave(); render(); }
  else if (a==="pzProp") { S.prop.items.forEach(it=>{ if (!S.pz.items.includes(it.id)) S.pz.items.push(it.id); }); if (S.prop.cliente && !S.pz.cliente) S.pz.cliente = S.prop.cliente; if (S.prop.asesor && !S.pz.asesor) { S.pz.asesor = S.prop.asesor; S.pz.mail = S.prop.mail || ""; S.pz.tel = S.prop.tel || ""; } pzSave(); render(); }
  else if (a==="pzClear") { S.pz.items = []; pzSave(); render(); }
  else if (a==="pzPDF") pzPDF();
  else if (a==="openSim") { S.sim = v; }
  else if (a==="simset") { S.simv[S.sim][b.dataset.k] = v; $("#simForm").innerHTML = simForm(); calcSim(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id==="q") { S.q = t.value; const pos = t.selectionStart; render(); const n = $("#q"); if (n) { n.focus(); try { n.setSelectionRange(pos,pos); } catch(_){} } }
  else if (t.dataset.s === "asesor" && S.sim === "cpd") { const v = S.simv.cpd, a = findAsesor(t.value); v.asesor = t.value;
    if (a) { if (t.value !== a.nombre) t.value = v.asesor = a.nombre; v.tel = a.tel || ""; v.mail = a.mail || ""; const te = $("#s_tel"), m = $("#s_mail"); if (te) te.value = v.tel; if (m) m.value = v.mail; }
    calcSim(); }

    if (t.dataset.pz==="asesor") { const a = findAsesor(t.value); if (a && t.value !== a.nombre) { t.value = S.pz.asesor = a.nombre; } if (a) { S.pz.mail = a.mail || ""; S.pz.tel = a.tel || ""; const m = $("#pz_mail"), te = $("#pz_tel"); if (m) m.value = S.pz.mail; if (te) te.value = S.pz.tel; } if (a && AREAS[a.area]) { S.pz.area = a.area; const sel = $("#pz_area"); if (sel) sel.value = a.area; } }
    pzSave(); refreshDeck(); }
  else if (t.dataset.pf) { S.prop[t.dataset.pf] = t.value;
    if (t.dataset.pf==="asesor") { const a = findAsesor(t.value); if (a) { if (t.value !== a.nombre) t.value = S.prop.asesor = a.nombre; S.prop.mail = a.mail || ""; S.prop.tel = a.tel || ""; delete S.prop.contacto; const m = $("#pr_mail"), te = $("#pr_tel"); if (m) m.value = S.prop.mail; if (te) te.value = S.prop.tel; } }
    persist(); refreshPreview(); }
  else if (t.dataset.pi) { S.prop.items[+t.dataset.pi].nota = t.value; persist(); refreshPreview(); }
});
/* Selector de PDF de Gestión: muestra el archivo elegido y acepta arrastrar y soltar. */
function pdfElegido(f){
  const ok = f && (f.type === "application/pdf" || /\.pdf$/i.test(f.name)), d = $("#dropPdf"), n = $("#dropNom"), sb = $("#dropSub"), b = $("#upBtn");
  if (!d) return;
  if (f && !ok) { toast("Tiene que ser un PDF"); return; }
  d.classList.toggle("ok", !!ok); if (n) n.textContent = ok ? f.name : "Elegí el PDF del one pager";
  if (sb) sb.textContent = ok ? `${fmt(f.size/1024/1024, 1)} MB · tocá para cambiarlo` : "o arrastralo acá"; if (b) b.disabled = !ok;
}
["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest("#dropPdf"); if (d) { e.preventDefault(); d.classList.add("over"); } }));
["dragleave","drop"].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest("#dropPdf"); if (!d) return; e.preventDefault(); d.classList.remove("over");
  if (ev === "drop" && e.dataTransfer.files[0]) { const i = $("#up_pdf"); try { i.files = e.dataTransfer.files; } catch(_) {} pdfElegido(e.dataTransfer.files[0]); } }));
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "up_pdf") { pdfElegido(t.files[0]); return; }
  if (t.id==="fEstado") { S.fEstado = t.value; render(); }
  else if (t.dataset.pzp) { const i = S.pz.items.indexOf(t.dataset.pzp); if (t.checked && i<0) S.pz.items.push(t.dataset.pzp); if (!t.checked && i>=0) S.pz.items.splice(i,1); pzSave(); render(); }
  else if (t.id==="pz_inst") { S.pz.inst = t.checked; pzSave(); refreshDeck(); }
  else if (t.id==="pz_area") { S.pz.area = t.value; pzSave(); refreshDeck(); }
  else if (t.id==="patrimonio") { S.cliente.patrimonio = t.value; persist(); render(); }
  else if (t.dataset.s && (t.tagName==="SELECT" || t.type==="checkbox")) { S.simv[S.sim][t.dataset.s] = t.type==="checkbox" ? t.checked : +t.value; $("#simForm").innerHTML = simForm(); calcSim(); }
});
document.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.id==="comitente") consultar(); });

/* ── Arranque ── */
/* One pagers originales (config/onepagers: id -> ruta, o {pdf, fecha}) para fichas sin uno subido desde Gestión. */
function conOnePager(p){ const r = S.onepagers && S.onepagers[p.id]; if (!p.onePager && r && !p.onePagerQuitado) { const o = typeof r === "string" ? {pdf:r} : r; p.onePager = {pdf:o.pdf, archivo:p.nombre+" - Neix.pdf", fecha:o.fecha||p.ultimaRevision||""}; } return p; }
function setProductos(list){ S.raw = list; list = list.map(p=>conOnePager(Object.assign({}, p))); S.productos = list.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")); S.byId = {}; list.forEach(p=>S.byId[p.id]=p); }
/* ── Acceso de editores (Firebase: link al mail) ── */
function vIngresar(){
  const ses = S.ses || {}, rt = window.neixRuntime || {};
  if (rt.mode !== "firebase") return stateMsg("Acceso editores", "En modo local, abrí el Hub con ?editor=1 para editar.");
  if (ses.editor) return `<div class="state"><h2>Ya podés editar</h2><p>Ingresaste como ${esc(ses.editor.email)}. Las fichas se editan desde Gestión.</p><a class="btn primary" href="#gestion" style="margin-top:18px">Ir a Gestión</a></div>`;
  const ing = S.ing || {};
  const form = (btn, act, hint) => `<div class="panel stack" style="max-width:420px;margin:18px auto 0;text-align:left"><label class="f" for="edMail">Tu mail de Neix<input class="input" id="edMail" type="email" autocomplete="email" placeholder="nombre@${esc(rt.dominio)}" value="${esc(ing.mail||"")}"></label><button class="btn primary" id="edBtn" data-act="${act}">${btn}</button><p class="tiny muted">${hint}</p></div>`;
  const err = ses.error ? `<p class="small" style="color:var(--crit);margin-top:10px">${esc(ses.error)}</p>` : "";
  if (ses.linkPendiente) return `<div class="state"><h2>Confirmá tu mail</h2><p>Abriste el link en otro navegador. Escribí el mail al que te llegó para terminar.</p>${err}${form("Confirmar", "completarLink", "")}</div>`;
  if (ing.enviado) return `<div class="state"><h2>Revisá tu mail</h2><p>Te mandamos un link a ${esc(ing.enviado)}. Abrilo desde este navegador para editar. Si no llega en unos minutos, revisá Correo no deseado.</p><button class="btn" data-act="ingOtra" style="margin-top:18px">Usar otro mail</button></div>`;
  return `<div class="state"><h2>Acceso editores</h2><p>Para editar fichas, ingresá tu mail. Te llega un link para entrar, sin contraseña.</p>${err}${form("Enviarme el link", "enviarLink", "Solo pueden editar los mails habilitados por Marketing.")}</div>`;
}
async function enviarLink(btn){
  const mail = ($("#edMail")||{}).value || ""; S.ing = {mail};
  btn.disabled = true; btn.textContent = "Enviando…";
  try { S.ing.enviado = await window.neixRuntime.enviarLink(mail); if (S.ses) S.ses.error = ""; render(); }
  catch(e) { btn.disabled = false; btn.textContent = "Enviarme el link"; toast(e && e.code === "wrong_domain" ? "Usá tu mail de " + window.neixRuntime.dominio : "No pudimos enviar el link. Probá de nuevo."); }
}
async function completarLink(btn){
  const mail = ($("#edMail")||{}).value || ""; S.ing = {mail};
  btn.disabled = true;
  try { await window.neixRuntime.completarLink(mail); }
  catch(e) { btn.disabled = false; toast("Ese mail no coincide con el link, o el link venció."); }
}
let notasOn = false;
function watchNotas(){
  if (notasOn || !S.db) return; notasOn = true;
  S.db.collection("notas").orderBy("fecha","desc").limit(50).onSnapshot(async snap => {
    S.notas = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    const ids = [...new Set(S.notas.map(n=>n.autor).filter(Boolean))];
    if (S.user && ids.length) { try { const ps = await S.user.profiles(ids); ids.forEach(i=>{ S.names[i] = (ps[i] && ps[i].name) || ""; }); } catch(_){} }
    if (route()==="gestion") softRender();
  }, ()=>{});
}
function softRender(){ const a = document.activeElement; if (a && (a.tagName==="TEXTAREA" || (a.tagName==="INPUT" && a.type!=="checkbox"))) return; render(); }
async function boot(){
  const st = document.createElement("style"); st.textContent = PP_CSS; document.head.appendChild(st);
  render(true);
  // Quién está usando el Hub (ingreso con Microsoft en Vercel). En local no existe y se ignora.
  fetch("api/me", {cache:"no-store"}).then(r => r.ok ? r.json() : null).then(me => { if (me && me.email) { S.me = me; render(); } }).catch(()=>{});
  const c = window.neixRuntime;
  if (!c || !c.use) { S.loading = false; S.dbMissing = true; render(); return; }
  c.use("downloads").then(d => { S.dl = d; });
  if (c.session) c.session().then(ses => { if (!ses) return; S.ses = ses; if ((ses.linkPendiente || ses.error) && route() !== "ingresar") go("ingresar"); else render(); }).catch(()=>{});
  c.use("assets").then(a => { S.assets = a; if (location.hash.startsWith("#editar-")) softRender(); });
  c.use("user").then(async u => { if (!u) return; S.user = u; try { S.canEdit = !!(await u.canEdit()); S.uid = await u.id(); } catch(_){} render(); if (S.canEdit && S.db) watchNotas(); });
  const db = await c.use("db");
  if (!db) { S.loading = false; S.dbMissing = true; render(); return; }
  S.db = db;
  if (puedeGestionar()) watchNotas();
  const timer = setTimeout(()=>{ S.slow = true; render(); }, 10000);
  // Si Firebase no deja leer (reglas sin publicar o base vacía), se muestran las fichas de public/data en solo lectura.
  let respaldo = false;
  const usarRespaldo = () => {
    if (respaldo || !c.staticDb) return false; respaldo = true; S.soloLectura = true;
    leer(c.staticDb()); return true;
  };
  const leer = (src) => {
  src.collection("productos").onSnapshot(snap => {
    if (!snap.docs.length && !snap.metadata.fromCache && src === db && usarRespaldo()) return;
    setProductos(snap.docs.map(d=>Object.assign({id:d.id}, JSON.parse(JSON.stringify(d.data())))));
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.loading = false; S.slow = false; }
    softRender();
  }, () => { if (src === db && usarRespaldo()) return; clearTimeout(timer); S.loading = false; if (!S.productos.length) S.dbMissing = true; render(); });
  src.collection("validaciones").onSnapshot(snap => { const v = {}; snap.docs.forEach(d=>v[d.id]=d.data()); S.vals = v; if (S.productos.length) softRender(); }, ()=>{});
  src.doc("config/asesores").onSnapshot(d => { S.asesores = d.exists ? (d.data().lista||[]) : []; const r = route(); if (r==="propuesta"||r==="presentaciones") softRender(); }, ()=>{});
  src.doc("config/impuestos").onSnapshot(d => { S.imp = d.exists ? d.data() : null; if (S.productos.length) softRender(); }, ()=>{});
  src.doc("config/onepagers").onSnapshot(d => { S.onepagers = d.exists ? (d.data().map||{}) : {}; if (S.raw) { setProductos(S.raw); softRender(); } }, ()=>{});
  };
  leer(db);
}
rutaActual = route();
boot();
/* Aviso de versión nueva: si se publicó un cambio mientras la pestaña está abierta, ofrece recargar
   (si no, se siguen usando las funciones de la versión anterior, por ejemplo al armar un PDF). */
(function(){
  let firma = null, avisado = false;
  const leer = () => fetch(location.pathname, {method:"HEAD", cache:"no-store", credentials:"same-origin"}).then(r => r.ok ? (r.headers.get("etag") || r.headers.get("last-modified") || "") : null).catch(() => null);
  const revisar = async () => {
    if (avisado || document.hidden) return;
    const f = await leer(); if (!f) return;
    if (firma === null) { firma = f; return; }
    if (f !== firma) { avisado = true; const d = document.createElement("div"); d.className = "nueva-ver"; d.setAttribute("role", "status");
      d.innerHTML = `<span>Hay una versión nueva del Hub.</span><button class="btn primary" type="button" onclick="location.reload()">Actualizar</button>`; document.body.appendChild(d); }
  };
  revisar(); setInterval(revisar, 120000); document.addEventListener("visibilitychange", revisar);
})();
})();
